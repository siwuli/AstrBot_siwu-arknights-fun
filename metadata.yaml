name: arknights_fun
display_name: 明日方舟娱乐整合
desc: "兔兔方舟娱乐三合一：每日「签到」领寻访凭证；标准概率「抽卡」（十连拼图复刻阿米娅原版：官图背景+稀有度边框+立绘裁剪+职业图标，支持 1~300 抽的数字/中文数字指令）；「猜干员」答题赚合成玉（连击+前三排名奖励，上限可配）。统一合成玉/凭证经济闭环；内置 AstrBot WebUI 管理后台（数据状态、用户资源调整、保底重置、卡池管理（查看可抽干员名单/编辑 UP）、一键更新）；干员池严格过滤召唤物与预备干员；数据存公共 gamedata 目录，与其他方舟插件共享不重复下载、自带增量更新，未下载时内置数据兜底，开箱即用"
help: "对兔兔说「签到」「十连」「一百连」「三百抽」「保底」「卡池」「卡池切换 N」「box」「我的干员」「寻访凭证」「猜干员」「猜干员 初级/中级/高级/资深」「猜干员排行」「猜干员数据」「数据状态」"
